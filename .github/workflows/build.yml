name: Build Android APK and iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DocuMate-Android-Debug-APK
          path: composeApp/build/outputs/apk/debug/*.apk

  build-ios:
    name: Build iOS IPA & Archive
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Shared Kotlin Multiplatform Framework
        run: ./gradlew :composeApp:assembleComposeAppDebugFramework

      - name: Build & Archive iOS App
        run: |
          mkdir -p build-output
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath build-output/iosApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload into unsigned .ipa
        run: |
          mkdir -p build-output/Payload
          cp -r build-output/iosApp.xcarchive/Products/Applications/iosApp.app build-output/Payload/
          cd build-output
          zip -r iosApp-unsigned.ipa Payload
          cd ..

      - name: Upload iOS xcarchive & IPA
        uses: actions/upload-artifact@v4
        with:
          name: DocuMate-iOS-Artifacts
          path: |
            build-output/iosApp-unsigned.ipa
            build-output/iosApp.xcarchive
