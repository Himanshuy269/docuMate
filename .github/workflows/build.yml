name: Build Android APK and iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DocuMate-Android-Debug-APK
          path: composeApp/build/outputs/apk/debug/*.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Kotlin Multiplatform Framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosArm64 --stacktrace

      - name: Stage Framework for Xcode
        run: |
          mkdir -p composeApp/build/xcode-frameworks/Debug/iphoneos
          cp -R composeApp/build/bin/iosArm64/debugFramework/ComposeApp.framework composeApp/build/xcode-frameworks/Debug/iphoneos/

      - name: Build iOS App with Xcode
        run: |
          mkdir -p build-output
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-output/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload into unsigned .ipa
        run: |
          mkdir -p build-output/Payload
          cp -R build-output/DerivedData/Build/Products/Debug-iphoneos/iosApp.app build-output/Payload/
          cd build-output
          zip -r iosApp-unsigned.ipa Payload
          cd ..

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: DocuMate-iOS-IPA
          path: build-output/iosApp-unsigned.ipa
